  "/v1/admin/settlements":
    get:
      summary: "Relevés"
      tags:
        - Admin
      operationId: getAdminSettlements
      parameters:
        - name: shop_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - open
              - settled
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
      x-roles:
        - admin
      responses:
        "200":
          description: "Succès"
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Settlement"
                  next_offset:
                    type:
                      - integer
                      - "null"
                required:
                  - items
                  - next_offset
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      summary: "Créer un relevé"
      tags:
        - Admin
      operationId: postAdminSettlements
      description: "Commandes remises sur la période (dates de Lomé, bornes incluses), jamais déjà réglées."
      x-roles:
        - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shop_id:
                  type: string
                  format: uuid
                period_start:
                  type: string
                  format: date
                period_end:
                  type: string
                  format: date
                note:
                  type: string
              required:
                - shop_id
                - period_start
                - period_end
      responses:
        "201":
          description: "Succès"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Settlement"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/admin/settlements/{id}":
    get:
      summary: "Un relevé"
      tags:
        - Admin
      operationId: getAdminSettlementsById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      x-roles:
        - admin
      responses:
        "200":
          description: "Succès"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Settlement"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    delete:
      summary: "Supprimer un relevé non réglé"
      tags:
        - Admin
      operationId: deleteAdminSettlementsById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      x-roles:
        - admin
      requestBody:
        required: true
        content:
