# Contrat de l'API ivia (OpenAPI 3.1). Source de vérité des routes : à tenir à jour avec le code.
openapi: "3.1.0"
info:
  title: "API ivia"
  version: "1.0.0"
  description: "Contrat de l'API REST utilisée par les apps acheteur, marchand, livreur et le back-office.\nToute nouvelle route est décrite ici dans le même commit que son code ; le test `TestOpenAPICoversAllRoutes` échoue sinon.\n\nAuthentification : `Authorization: Bearer <jeton>` (POST /v1/auth/verify). `x-roles` indique le rôle requis (`any` : tout utilisateur connecté). Une ressource d'un autre utilisateur renvoie 404.\n\nMontants en FCFA entiers (`_xof`). Dates en UTC (RFC 3339). Listes paginées : `limit`, `offset`, `next_offset`."
servers:
  - url: "http://localhost:8080"
    description: Local
security:
  - bearer: []
paths:
  "/health":
    get:
      summary: "Le processus répond (ne sollicite pas la base)"
      tags:
        - "Santé"
      operationId: getHealth
      security: []
      responses:
        "200":
          description: "Succès"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Status"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/ready":
    get:
      summary: "L'API peut servir des requêtes (la base répond)"
      tags:
        - "Santé"
      operationId: getReady
      security: []
      responses:
        "200":
          description: "Prête (503 si la base est injoignable)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Status"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/auth/otp":
    post:
      summary: "Envoyer un code de connexion"
      tags:
        - Connexion
      operationId: postAuthOtp
      description: "Même réponse que le compte existe ou non. 1 code par minute et 10 par jour par destinataire (429 `otp_rate_limited`, `otp_daily_limit`). Seul le canal `email` est ouvert au lancement."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  enum:
                    - email
                    - whatsapp
                    - sms
                recipient:
                  type: string
              required:
                - recipient
      responses:
        "202":
          description: "Succès"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OTPRequested"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/auth/verify":
    post:
      summary: "Vérifier le code et ouvrir une session"
      tags:
        - Connexion
      operationId: postAuthVerify
      description: "Crée le compte (rôle buyer) à la première connexion. Erreurs : `otp_invalid`, `otp_expired`, `otp_too_many_attempts` (5 essais)."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  enum:
                    - email
                    - whatsapp
                    - sms
                recipient:
                  type: string
                code:
                  type: string
              required:
                - recipient
                - code
      responses:
        "200":
          description: "Succès"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Session"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/auth/logout":
    post:
      summary: "Se déconnecter (session courante)"
      tags:
        - Connexion
      operationId: postAuthLogout
      x-roles:
        - any
      responses:
        "204":
          description: "Effectué"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/auth/logout-all":
    post:
      summary: "Se déconnecter de tous les appareils"
      tags:
        - Connexion
      operationId: postAuthLogoutAll
      x-roles:
        - any
      responses:
        "204":
          description: "Effectué"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/me":
    get:
      summary: "Mon profil"
      tags:
        - Compte
      operationId: getMe
      x-roles:
        - any
      responses:
        "200":
          description: "Succès"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    patch:
      summary: "Modifier mon profil"
      tags:
        - Compte
      operationId: patchMe
      x-roles:
        - any
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                phone:
                  type: string
                  description: "Mobile togolais ; chaîne vide pour effacer."
                accept_privacy_policy:
                  type: boolean
                  description: "`true` enregistre le consentement à la politique de confidentialité (daté par le serveur à la première acceptation). `false` est refusé (`validation_failed`) : le consentement se retire en supprimant son compte."
      responses:
        "200":
          description: "Succès"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    delete:
      summary: "Supprimer mon compte"
      tags:
        - Compte
      operationId: deleteMe
      description: "Données personnelles effacées, commandes et paiements conservés. Refusé avec une commande ou une mission en cours (`active_orders`, `active_shop_orders`, `active_mission`)."
      x-roles:
        - any
      responses:
        "204":
          description: "Effectué"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/me/addresses":
    get:
      summary: "Mon carnet d'adresses"
      tags:
        - Compte
      operationId: getMeAddresses
      x-roles:
        - any
      responses:
        "200":
          description: "Succès"
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Address"
                required:
                  - items
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      summary: "Ajouter une adresse"
      tags:
        - Compte
      operationId: postMeAddresses
      x-roles:
        - any
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AddressInput"
      responses:
        "201":
          description: "Succès"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Address"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/me/addresses/{id}":
    put:
      summary: "Remplacer une adresse"
      tags:
        - Compte
      operationId: putMeAddressesById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      x-roles:
        - any
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AddressInput"
      responses:
        "200":
          description: "Succès"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Address"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    delete:
      summary: "Supprimer une adresse"
      tags:
        - Compte
      operationId: deleteMeAddressesById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      x-roles:
        - any
      responses:
        "204":
          description: "Effectué"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/me/devices":
    put:
      summary: "Enregistrer le jeton push de l'appareil"
      tags:
        - Compte
      operationId: putMeDevices
      x-roles:
        - any
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                platform:
                  type: string
                  enum:
                    - android
                    - ios
                app:
                  type: string
                  enum:
                    - buyer
                    - seller
                    - driver
              required:
                - token
                - platform
                - app
      responses:
        "204":
          description: "Effectué"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    delete:
      summary: "Retirer le jeton push de l'appareil"
      tags:
        - Compte
      operationId: deleteMeDevices
      x-roles:
        - any
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required:
                - token
      responses:
        "204":
          description: "Effectué"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/neighborhoods":
    get:
      summary: "Quartiers actifs"
      tags:
        - Quartiers
      operationId: getNeighborhoods
      security: []
      responses:
        "200":
          description: "Succès"
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Neighborhood"
                required:
                  - items
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/uploads":
    post:
      summary: "Préparer l'envoi d'un fichier"
      tags:
        - Fichiers
      operationId: postUploads
      description: "URL signée valable 5 minutes ; type et taille exacte imposés. PDF réservé aux documents des livreurs (compartiment privé)."
      x-roles:
        - any
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                purpose:
                  type: string
                  enum:
                    - product_image
                    - shop_logo
                    - driver_document
                content_type:
                  type: string
                  enum:
                    - image/jpeg
                    - image/png
                    - image/webp
                    - application/pdf
                size_bytes:
                  type: integer
                  maximum: 5242880
              required:
                - purpose
                - content_type
                - size_bytes
      responses:
        "201":
          description: "Succès"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Upload"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/notifications":
    get:
      summary: "Mes notifications"
      tags:
        - Notifications
      operationId: getNotifications
      parameters:
        - name: app
          in: query
          required: false
          schema:
            type: string
            enum:
              - buyer
              - seller
              - driver
              - admin
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
      x-roles:
        - any
      responses:
        "200":
          description: "Succès"
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Notification"
                  next_offset:
                    type:
                      - integer
                      - "null"
                  unread_count:
                    type: integer
                    format: int64
                required:
                  - items
                  - next_offset
                  - unread_count
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/notifications/{id}/read":
    post:
      summary: "Marquer une notification comme lue"
      tags:
        - Notifications
      operationId: postNotificationsByIdRead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      x-roles:
        - any
      responses:
        "204":
          description: "Effectué"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/notifications/read-all":
    post:
      summary: "Tout marquer comme lu"
      tags:
        - Notifications
      operationId: postNotificationsReadAll
      parameters:
        - name: app
          in: query
          required: false
          schema:
            type: string
            enum:
              - buyer
              - seller
              - driver
              - admin
      x-roles:
        - any
      responses:
        "204":
          description: "Effectué"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/categories":
    get:
      summary: "Catégories actives"
      tags:
        - Catalogue
      operationId: getCategories
      security: []
      responses:
        "200":
          description: "Succès"
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Category"
                required:
                  - items
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/products/{id}":
    get:
      summary: "Fiche produit"
      tags:
        - Catalogue
      operationId: getProductsById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security: []
      responses:
        "200":
          description: "Succès"
          content:
            application/json:
              schema:
                type: object
                properties:
                  product:
                    "$ref": "#/components/schemas/Product"
                  shop:
                    "$ref": "#/components/schemas/PublicShop"
                required:
                  - product
                  - shop
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/shops/{id}":
    get:
      summary: "Fiche boutique"
      tags:
        - Boutiques
      operationId: getShopsById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security: []
      responses:
        "200":
          description: "Succès"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PublicShop"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/shops/{id}/products":
    get:
      summary: "Produits d'une boutique"
      tags:
        - Catalogue
      operationId: getShopsByIdProducts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
      security: []
      responses:
        "200":
          description: "Succès"
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Product"
                  next_offset:
                    type:
                      - integer
                      - "null"
                required:
                  - items
                  - next_offset
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/search/products":
    get:
      summary: "Rechercher des produits"
      tags:
        - Recherche
      operationId: getSearchProducts
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: "Texte (tolère les fautes de frappe)."
        - name: category_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: shop_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: min_price
          in: query
          required: false
          schema:
            type: integer
            format: int64
            description: "Montant en FCFA (entier)."
        - name: max_price
          in: query
          required: false
          schema:
            type: integer
            format: int64
            description: "Montant en FCFA (entier)."
        - name: neighborhood_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: lat
          in: query
          required: false
          schema:
            type: number
        - name: lng
          in: query
          required: false
          schema:
            type: number
        - name: radius_m
          in: query
          required: false
          schema:
            type: integer
            minimum: 100
            maximum: 50000
          description: "« Autour de moi » (lat et lng requis)."
        - name: in_stock
          in: query
          required: false
          schema:
            type: boolean
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - relevance
              - distance
              - price_asc
              - price_desc
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
      security: []
      responses:
        "200":
          description: "Succès"
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/ProductHit"
                  next_offset:
                    type:
                      - integer
                      - "null"
                required:
                  - items
                  - next_offset
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/search/shops":
    get:
      summary: "Rechercher des boutiques"
      tags:
        - Recherche
      operationId: getSearchShops
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: neighborhood_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: lat
          in: query
          required: false
          schema:
            type: number
        - name: lng
          in: query
          required: false
          schema:
            type: number
        - name: radius_m
          in: query
          required: false
          schema:
            type: integer
            minimum: 100
            maximum: 50000
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - relevance
              - distance
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
      security: []
      responses:
        "200":
          description: "Succès"
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/ShopHit"
                  next_offset:
                    type:
                      - integer
                      - "null"
                required:
                  - items
                  - next_offset
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/shops":
    post:
      summary: "Créer une boutique"
      tags:
        - Boutiques
      operationId: postShops
      description: "La boutique est en attente de validation par l'admin ; son créateur obtient le rôle seller."
      x-roles:
        - any
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ShopInput"
      responses:
        "201":
          description: "Succès"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Shop"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/seller/shops":
    get:
      summary: "Mes boutiques"
      tags:
        - Marchand
      operationId: getSellerShops
      x-roles:
        - seller
      responses:
        "200":
          description: "Succès"
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Shop"
                required:
                  - items
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/seller/shops/{id}":
    get:
      summary: "Une de mes boutiques"
      tags:
        - Marchand
      operationId: getSellerShopsById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      x-roles:
        - seller
      responses:
        "200":
          description: "Succès"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Shop"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    patch:
      summary: "Modifier ma boutique"
      tags:
        - Marchand
      operationId: patchSellerShopsById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      x-roles:
        - seller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ShopInput"
      responses:
