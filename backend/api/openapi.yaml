components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: "Jeton de session opaque."
  schemas:
    Status:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - unavailable
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: "Code stable en anglais (ex. `otp_expired`)."
            message:
              type: string
              description: "Message en français, affichable à l'utilisateur."
            fields:
              type: object
              additionalProperties:
                type: string
              description: "Erreurs par champ (validation_failed)."
          required:
            - code
            - message
      required:
        - error
      description: "Format commun de toutes les erreurs de l'API."
    Point:
      type: object
      properties:
        lat:
          type: number
        lng:
          type: number
      required:
        - lat
        - lng
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type:
            - string
            - "null"
        phone:
          type:
            - string
            - "null"
        first_name:
          type: string
        last_name:
          type: string
        roles:
          type: array
          items:
            type: string
            enum:
              - buyer
              - seller
              - driver
              - admin
        privacy_consent_at:
          type:
            - string
            - "null"
          format: date-time
          description: "Date d'acceptation de la politique de confidentialité."
        profile_complete:
          type: boolean
          description: "Prénom, téléphone et consentement renseignés : requis pour commander ou postuler comme livreur."
        created_at:
          type: string
          format: date-time
      required:
        - id
        - email
        - phone
        - first_name
        - last_name
        - roles
        - privacy_consent_at
        - profile_complete
        - created_at
    OTPRequested:
      type: object
