components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: "Jeton de session opaque."
  schemas:
    PromoVisual:
      type: object
      description: "Visuel publicitaire publié par l'admin."
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - banner
            - modal
            - interstitial
            - welcome
            - monthly
            - poster
        title:
          type: string
        subtitle:
          type: string
        body:
          type: string
        image_key:
          type: string
          description: "Clé promo_visual (POST /v1/uploads)."
        product_id:
          type:
            - string
            - "null"
          format: uuid
        cta_label:
          type: string
        external_url:
          type: string
          description: "Lien https:// (site officiel) ; vide sinon."
        placements:
          type: array
          items:
            type: string
            enum:
              - home_hero
              - home_feed
              - catalog_feed
              - modal
              - interstitial
              - splash
        apps:
          type: array
          items:
            type: string
            enum:
              - buyer
              - seller
              - driver
        priority:
          type: integer
          minimum: 0
          maximum: 100
        weight:
          type: integer
          minimum: 1
          maximum: 100
        starts_at:
          type:
            - string
            - "null"
          format: date-time
        ends_at:
          type:
            - string
            - "null"
          format: date-time
        image_url:
          type: string
        is_active:
          type: boolean
        live:
          type: boolean
          description: "Actif et dans sa période de diffusion."
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - kind
        - title
        - subtitle
        - body
        - image_key
        - image_url
        - product_id
        - cta_label
        - external_url
        - placements
        - apps
        - priority
        - weight
        - starts_at
        - ends_at
        - is_active
        - live
        - created_at
        - updated_at
    PromoVisualInput:
      type: object
      properties:
        kind:
          type: string
          enum:
            - banner
            - modal
            - interstitial
            - welcome
            - monthly
            - poster
        title:
          type: string
        subtitle:
          type: string
        body:
          type: string
        image_key:
          type: string
          description: "Clé promo_visual (POST /v1/uploads)."
        product_id:
          type:
            - string
            - "null"
          format: uuid
        cta_label:
          type: string
        external_url:
          type: string
          description: "Lien https:// (site officiel) ; vide sinon."
        placements:
          type: array
          items:
            type: string
            enum:
              - home_hero
              - home_feed
              - catalog_feed
              - modal
              - interstitial
              - splash
        apps:
          type: array
          items:
            type: string
            enum:
              - buyer
              - seller
              - driver
        priority:
          type: integer
          minimum: 0
          maximum: 100
        weight:
          type: integer
          minimum: 1
          maximum: 100
        starts_at:
          type:
            - string
            - "null"
          format: date-time
        ends_at:
          type:
            - string
            - "null"
          format: date-time
        is_active:
          type: boolean
      required:
        - kind
        - title
        - image_key
        - placements
    PromoFeedVisual:
      description: "Visuel du fil (champs de PromoVisual) avec le produit commandable s'il est en vente."
      allOf:
        - "$ref": "#/components/schemas/PromoVisual"
        - type: object
          properties:
            product:
              oneOf:
                - "$ref": "#/components/schemas/Product"
                - type: "null"
          required:
            - product
    PromoSettings:
      type: object
      description: "Réglages de diffusion ; les apps appliquent délai, intervalle, plafond et rotation."
      properties:
        enabled:
          type: boolean
        banners_enabled:
          type: boolean
        modal_enabled:
          type: boolean
        interstitial_enabled:
          type: boolean
        first_delay_seconds:
          type: integer
          minimum: 0
          maximum: 600
        min_interval_seconds:
          type: integer
          minimum: 15
          maximum: 3600
        max_per_session:
          type: integer
          minimum: 0
          maximum: 50
        feed_every:
          type: integer
          minimum: 3
          maximum: 50
          description: "Un produit mis en avant revient toutes les N cartes."
        rotation:
          type: string
          enum:
            - weighted
            - random
            - priority
        official_url:
          type: string
        updated_at:
          type: string
          format: date-time
      required:
        - enabled
        - banners_enabled
        - modal_enabled
        - interstitial_enabled
        - first_delay_seconds
        - min_interval_seconds
        - max_per_session
        - feed_every
        - rotation
        - official_url
    PromoFeed:
      type: object
      properties:
        settings:
          "$ref": "#/components/schemas/PromoSettings"
        visuals:
          type: array
          items:
            "$ref": "#/components/schemas/PromoFeedVisual"
        featured:
          type: array
          items:
            "$ref": "#/components/schemas/Product"
      required:
        - settings
        - visuals
        - featured
    PromoEvent:
      type: object
      description: "Visual_id ou product_id obligatoire ; un événement invalide est ignoré."
      properties:
        kind:
          type: string
          enum:
            - impression
            - dismiss
            - click_order
            - click_product
            - click_site
            - order
        visual_id:
          type:
            - string
            - "null"
          format: uuid
        product_id:
          type:
            - string
            - "null"
          format: uuid
        placement:
          type: string
      required:
        - kind
    PromoEventBatch:
      type: object
      properties:
        app:
          type: string
          enum:
            - buyer
            - seller
            - driver
        session_id:
          type: string
          minLength: 8
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
          description: "Tiré au hasard par l'app, sans lien avec le compte."
        events:
          type: array
          maxItems: 50
          items:
            "$ref": "#/components/schemas/PromoEvent"
      required:
        - app
        - session_id
        - events
    PromoStats:
      type: object
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        impressions:
          type: integer
          format: int64
        dismissals:
          type: integer
          format: int64
        order_clicks:
          type: integer
          format: int64
        product_clicks:
          type: integer
          format: int64
        site_clicks:
          type: integer
          format: int64
        orders:
          type: integer
          format: int64
        sessions:
          type: integer
          format: int64
        ctr_pct:
          type: number
        conversion_pct:
          type: number
        per_day:
          type: array
          items:
            type: object
            properties:
              day:
                type: string
                format: date
              impressions:
                type: integer
