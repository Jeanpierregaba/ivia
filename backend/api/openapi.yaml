# Contrat de l'API ivia (OpenAPI 3.1). Source de vérité des routes : à tenir à jour avec le code.
openapi: "3.1.0"
info:
  title: "API ivia"
  version: "1.0.0"
  description: "Contrat de l'API REST utilisée par les apps acheteur, marchand, livreur et le back-office.\nToute nouvelle route est décrite ici dans le même commit que son code ; le test `TestOpenAPICoversAllRoutes` échoue sinon.\n\nAuthentification : `Authorization: Bearer <jeton>` (POST /v1/auth/verify). `x-roles` indique le rôle requis (`any` : tout utilisateur connecté). Une ressource d'un autre utilisateur renvoie 404.\n\nMontants en FCFA entiers (`_xof`). Dates en UTC (RFC 3339). Listes paginées : `limit`, `offset`, `next_offset`."
servers:
  - url: "http://localhost:8080"
    description: Local
security:
  - bearer: []
paths:
  "/health":
    get:
      summary: "Le processus répond (ne sollicite pas la base)"
      tags:
        - "Santé"
      operationId: getHealth
      security: []
      responses:
        "200":
          description: "Succès"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Status"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/ready":
    get:
      summary: "L'API peut servir des requêtes (la base répond)"
      tags:
        - "Santé"
      operationId: getReady
      security: []
      responses:
        "200":
          description: "Prête (503 si la base est injoignable)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Status"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/auth/otp":
    post:
      summary: "Envoyer un code de connexion"
      tags:
        - Connexion
      operationId: postAuthOtp
      deprecated: true
      description: "Ancienne connexion par code (ADR 0006), remplacée par le mot de passe (ADR 0011) : gardée le temps que les apps migrent. Même réponse que le compte existe ou non. 1 code par minute et 10 par jour par destinataire (429 `otp_rate_limited`, `otp_daily_limit`). Seul le canal `email` est ouvert au lancement."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  enum:
                    - email
                    - whatsapp
                    - sms
                recipient:
                  type: string
              required:
                - recipient
      responses:
        "202":
          description: "Succès"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OTPRequested"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/auth/verify":
    post:
      summary: "Vérifier le code et ouvrir une session"
      tags:
        - Connexion
      operationId: postAuthVerify
      deprecated: true
      description: "Ancienne connexion par code (ADR 0006), remplacée par le mot de passe (ADR 0011). N'ouvre jamais le back-office (pas de double vérification). Crée le compte (rôle buyer) à la première connexion. Erreurs : `otp_invalid`, `otp_expired`, `otp_too_many_attempts` (5 essais)."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  enum:
                    - email
                    - whatsapp
                    - sms
                recipient:
                  type: string
                code:
                  type: string
              required:
                - recipient
                - code
      responses:
        "200":
          description: "Succès"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Session"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/auth/providers":
    get:
      summary: "Modes de connexion disponibles"
      tags:
        - Connexion
      operationId: getAuthProviders
      description: "`google` vaut false tant que les identifiants OAuth ne sont pas configurés (GOOGLE_CLIENT_IDS) : l'app masque alors le bouton."
      security: []
      responses:
        "200":
          description: "Succès"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthProviders"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/auth/signup/code":
    post:
      summary: "Création de compte : envoyer le code"
      tags:
        - Connexion
      operationId: postAuthSignupCode
      description: "Envoie un code à 6 chiffres à l'adresse. Même réponse que le compte existe ou non. 1 code par minute et par usage, 10 par jour par adresse (429)."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
                - email
      responses:
        "202":
          description: "Succès"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OTPRequested"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/auth/signup":
    post:
      summary: "Création de compte : code et mot de passe"
      tags:
        - Connexion
      operationId: postAuthSignup
      description: "Vérifie le code (5 essais, 10 min) puis enregistre le mot de passe (10 à 128 caractères, pas un mot de passe courant ni l'e-mail) et ouvre une session. Un compte de l'ancienne connexion par code reçoit ici son mot de passe ; un compte qui en a déjà un : 409 `account_exists`."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
                password:
                  type: string
                  minLength: 10
                  maxLength: 128
              required:
                - email
                - code
                - password
      responses:
        "201":
          description: "Succès"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Session"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/auth/login":
    post:
      summary: "Connexion par mot de passe"
      tags:
        - Connexion
      operationId: postAuthLogin
      description: "Même erreur `invalid_credentials` que le compte existe ou non. Après 10 échecs, compte bloqué 15 min (429 `account_locked`, débloqué par « mot de passe oublié »). Pour le back-office, la session doit ensuite passer la double vérification (/v1/auth/mfa/code puis /v1/auth/mfa/verify)."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  maxLength: 512
              required:
                - email
                - password
      responses:
        "200":
          description: "Succès"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Session"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/auth/password/forgot":
    post:
      summary: "Mot de passe oublié : envoyer le code"
      tags:
        - Connexion
      operationId: postAuthPasswordForgot
      description: "Envoie un code si le compte existe ; même réponse sinon."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
                - email
      responses:
        "202":
          description: "Succès"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OTPRequested"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/auth/password/reset":
    post:
      summary: "Mot de passe oublié : code et nouveau mot de passe"
      tags:
        - Connexion
      operationId: postAuthPasswordReset
      description: "Vérifie le code, change le mot de passe, débloque le compte, déconnecte tous les appareils et ouvre une nouvelle session."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
                password:
                  type: string
                  minLength: 10
                  maxLength: 128
              required:
                - email
                - code
                - password
      responses:
        "200":
          description: "Succès"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Session"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/auth/google":
    post:
      summary: "Connexion avec Google"
      tags:
        - Connexion
      operationId: postAuthGoogle
      description: "Jeton d'identité Google (Sign in with Google) vérifié par le serveur : signature RS256 de Google, émetteur, application (GOOGLE_CLIENT_IDS), expiration, e-mail vérifié. Compte rattaché au compte Google, sinon au compte de même e-mail, sinon créé. `google_disabled` sans configuration, `google_token_invalid` sinon."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id_token:
                  type: string
                  maxLength: 8192
              required:
                - id_token
      responses:
        "200":
          description: "Succès"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Session"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/auth/session":
    get:
      summary: "État de la session courante"
      tags:
        - Connexion
      operationId: getAuthSession
      description: "Double vérification passée (`mfa_verified`), mot de passe défini, expiration."
      x-roles:
        - any
      responses:
        "200":
          description: "Succès"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SessionInfo"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/auth/mfa/code":
    post:
      summary: "Double vérification : envoyer le code"
      tags:
        - Connexion
      operationId: postAuthMfaCode
      description: "Envoie un code à l'e-mail du compte connecté. Exigé pour le back-office : sans session vérifiée, les routes admin répondent 403 `mfa_required`."
      x-roles:
        - any
      responses:
        "202":
          description: "Succès"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OTPRequested"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/auth/mfa/verify":
    post:
      summary: "Double vérification : vérifier le code"
      tags:
        - Connexion
      operationId: postAuthMfaVerify
      description: "Marque la session comme vérifiée ; elle expire alors au plus 8 h plus tard, sans prolongation."
      x-roles:
        - any
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
              required:
                - code
      responses:
        "200":
          description: "Succès"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SessionInfo"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/me/password":
    post:
      summary: "Changer de mot de passe"
      tags:
        - Connexion
      operationId: postMePassword
      description: "Mot de passe actuel exigé s'il en existe un (un compte créé avec Google peut en définir un). Les autres appareils sont déconnectés."
      x-roles:
        - any
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 10
                  maxLength: 128
              required:
                - new_password
      responses:
        "204":
          description: "Effectué"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/auth/logout":
    post:
      summary: "Se déconnecter (session courante)"
      tags:
        - Connexion
      operationId: postAuthLogout
      x-roles:
        - any
      responses:
        "204":
          description: "Effectué"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/auth/logout-all":
    post:
      summary: "Se déconnecter de tous les appareils"
      tags:
        - Connexion
      operationId: postAuthLogoutAll
      x-roles:
        - any
      responses:
        "204":
          description: "Effectué"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/me":
    get:
      summary: "Mon profil"
      tags:
        - Compte
      operationId: getMe
      x-roles:
        - any
      responses:
        "200":
          description: "Succès"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    patch:
      summary: "Modifier mon profil"
      tags:
        - Compte
      operationId: patchMe
      x-roles:
        - any
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                phone:
                  type: string
                  description: "Mobile togolais ; chaîne vide pour effacer."
                accept_privacy_policy:
                  type: boolean
                  description: "`true` enregistre le consentement à la politique de confidentialité (daté par le serveur à la première acceptation). `false` est refusé (`validation_failed`) : le consentement se retire en supprimant son compte."
      responses:
        "200":
          description: "Succès"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    delete:
      summary: "Supprimer mon compte"
      tags:
        - Compte
      operationId: deleteMe
      description: "Données personnelles effacées, commandes et paiements conservés. Refusé avec une commande ou une mission en cours (`active_orders`, `active_shop_orders`, `active_mission`)."
      x-roles:
        - any
      responses:
        "204":
          description: "Effectué"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/me/addresses":
    get:
      summary: "Mon carnet d'adresses"
      tags:
        - Compte
      operationId: getMeAddresses
      x-roles:
        - any
      responses:
        "200":
          description: "Succès"
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Address"
                required:
                  - items
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      summary: "Ajouter une adresse"
      tags:
        - Compte
      operationId: postMeAddresses
      x-roles:
        - any
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AddressInput"
      responses:
        "201":
          description: "Succès"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Address"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/me/addresses/{id}":
    put:
      summary: "Remplacer une adresse"
      tags:
        - Compte
      operationId: putMeAddressesById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      x-roles:
        - any
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AddressInput"
      responses:
        "200":
          description: "Succès"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Address"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    delete:
      summary: "Supprimer une adresse"
      tags:
        - Compte
      operationId: deleteMeAddressesById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      x-roles:
        - any
      responses:
        "204":
          description: "Effectué"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/me/devices":
    put:
      summary: "Enregistrer le jeton push de l'appareil"
      tags:
        - Compte
      operationId: putMeDevices
      x-roles:
        - any
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                platform:
                  type: string
                  enum:
                    - android
                    - ios
                app:
                  type: string
                  enum:
                    - buyer
                    - seller
                    - driver
                    - pharmacy
              required:
                - token
                - platform
                - app
      responses:
        "204":
          description: "Effectué"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    delete:
      summary: "Retirer le jeton push de l'appareil"
      tags:
        - Compte
      operationId: deleteMeDevices
      x-roles:
        - any
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required:
                - token
      responses:
        "204":
          description: "Effectué"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/neighborhoods":
    get:
      summary: "Quartiers actifs"
      tags:
        - Quartiers
      operationId: getNeighborhoods
      security: []
      responses:
        "200":
          description: "Succès"
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Neighborhood"
                required:
                  - items
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/uploads":
    post:
      summary: "Préparer l'envoi d'un fichier"
      tags:
        - Fichiers
      operationId: postUploads
      description: "URL signée valable 5 minutes ; type et taille exacte imposés. PDF réservé aux documents des livreurs (compartiment privé)."
      x-roles:
        - any
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                purpose:
                  type: string
                  enum:
                    - product_image
                    - shop_logo
                    - driver_document
                    - merchant_document
                    - promo_visual
                    - pharmacy_document
                    - pharmacy_alert_photo
                content_type:
                  type: string
                  enum:
                    - image/jpeg
                    - image/png
                    - image/webp
                    - application/pdf
                size_bytes:
                  type: integer
                  maximum: 5242880
              required:
                - purpose
                - content_type
                - size_bytes
      responses:
        "201":
          description: "Succès"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Upload"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/notifications":
    get:
      summary: "Mes notifications"
      tags:
        - Notifications
      operationId: getNotifications
      parameters:
        - name: app
          in: query
          required: false
          schema:
            type: string
            enum:
              - buyer
              - seller
              - driver
              - admin
              - pharmacy
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
      x-roles:
        - any
      responses:
        "200":
          description: "Succès"
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Notification"
                  next_offset:
                    type:
                      - integer
                      - "null"
                  unread_count:
                    type: integer
                    format: int64
                required:
                  - items
                  - next_offset
                  - unread_count
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/notifications/{id}/read":
    post:
      summary: "Marquer une notification comme lue"
      tags:
        - Notifications
      operationId: postNotificationsByIdRead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      x-roles:
        - any
      responses:
        "204":
          description: "Effectué"
        default:
          description: "Erreur (voir `code`)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/notifications/read-all":
    post:
      summary: "Tout marquer comme lu"
      tags:
        - Notifications
      operationId: postNotificationsReadAll
      parameters:
        - name: app
          in: query
          required: false
          schema:
            type: string
            enum:
