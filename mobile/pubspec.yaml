# Racine du pub workspace : 3 apps et 2 paquets partagés (ADR 0002).
# `flutter pub get` se lance ici et produit un seul pubspec.lock pour tout le workspace.
name: ivia_workspace
publish_to: none

environment:
  sdk: ^3.13.5

workspace:
  - apps/buyer
  - apps/seller
  - apps/driver
  - packages/api_client
  - packages/app_core
  - packages/ui

dev_dependencies:
  flutter_lints: ^6.0.0
