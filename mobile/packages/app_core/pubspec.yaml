name: ivia_app_core
description: "Session, connexion par numéro et utilitaires communs aux apps ivia."
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.5
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  google_maps_flutter: ^2.13.1
  latlong2: ^0.10.1
  url_launcher: ^6.3.2
  geolocator: ^14.1.2
  go_router: ^18.1.2
  image_picker: ^1.2.4
  ivia_api_client: any
  ivia_ui: any
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_secure_storage: ^11.2.0
  flutter_test:
    sdk: flutter
  geolocator_platform_interface: ^4.4.1
  plugin_platform_interface: ^2.1.8
  shared_preferences_platform_interface: ^2.4.2
