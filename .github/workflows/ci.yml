name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  # Aucun secret dans le dépôt, historique compris (règles et exceptions : .gitleaks.toml). Un
  # secret détecté est considéré comme compromis : le changer (infra/README.md), puis le retirer.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2
          git /repo --config /repo/.gitleaks.toml --redact --no-banner

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Même image que docker-compose.yml.
      postgres:
        image: postgis/postgis:18-3.6-alpine
        env:
          POSTGRES_USER: ivia
          POSTGRES_DB: ivia
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ivia -d ivia"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://ivia@localhost:5432/ivia?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: sqlc (code généré à jour)
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 diff
      - run: go test -race ./...
      - run: go build ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Contrat OpenAPI valide
        run: npx --yes @redocly/cli@2 lint backend/api/openapi.yaml

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g pnpm@10.34.9
      - run: pnpm install --frozen-lockfile
      - name: Types de l'API à jour avec openapi.yaml
        run: pnpm gen:api && git diff --exit-code lib/api-types.ts
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      # Chaque app et chaque paquet du workspace a ses propres tests.
      - name: flutter test
        run: for member in apps/* packages/*; do (cd "$member" && flutter test) || exit 1; done

  # Image de l'API publiée sur GitHub Container Registry après chaque fusion sur main (ADR 0008).
  # Étiquette = SHA du commit : c'est l'API_TAG déployé (voir infra/README.md).
  api-image:
    # main : production ; develop : staging (deploy.sh <sha> sur le serveur concerné).
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: [backend, contract]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construire et publier
        run: |
          image="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/ivia-api"
          docker build --build-arg APP_VERSION="${{ github.sha }}" -t "$image:${{ github.sha }}" backend
          docker push "$image:${{ github.sha }}"

  # Image du back-office, publiée comme celle de l'API (ADMIN_TAG = SHA du commit).
  admin-image:
    # main : production ; develop : staging (deploy.sh <sha> sur le serveur concerné).
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: [admin]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construire et publier
        run: |
          image="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/ivia-admin"
          docker build -t "$image:${{ github.sha }}" admin
          docker push "$image:${{ github.sha }}"
