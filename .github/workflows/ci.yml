name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Même image que docker-compose.yml.
      postgres:
        image: postgis/postgis:18-3.6-alpine
        env:
          POSTGRES_USER: ivia
          POSTGRES_DB: ivia
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ivia -d ivia"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://ivia@localhost:5432/ivia?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: sqlc (code généré à jour)
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 diff
      - run: go test -race ./...
      - run: go build ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Contrat OpenAPI valide
        run: npx --yes @redocly/cli@2 lint backend/api/openapi.yaml

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      # Chaque app et chaque paquet du workspace a ses propres tests.
      - name: flutter test
        run: for member in apps/* packages/*; do (cd "$member" && flutter test) || exit 1; done

  # Image de l'API publiée sur GitHub Container Registry après chaque fusion sur main (ADR 0008).
  # Étiquette = SHA du commit : c'est l'API_TAG déployé (voir infra/README.md).
  api-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, contract]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construire et publier
        run: |
          image="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/ivia-api"
          docker build --build-arg APP_VERSION="${{ github.sha }}" -t "$image:${{ github.sha }}" backend
          docker push "$image:${{ github.sha }}"
