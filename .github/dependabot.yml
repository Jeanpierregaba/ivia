# Mises à jour automatiques des dépendances : https://docs.github.com/code-security/dependabot
# River est volontairement suivi de près : version pré-1.0, notes de version à lire avant de fusionner (ADR 0005).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    groups:
      river:
        patterns: ["github.com/riverqueue/*"]
  - package-ecosystem: pub
    directory: /mobile
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /admin
    schedule:
      interval: weekly
    groups:
      next:
        patterns: ["next", "react", "react-dom", "eslint-config-next", "@types/react*"]
