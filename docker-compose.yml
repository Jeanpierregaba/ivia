# Services de développement local. Démarrer : docker compose up -d --wait
services:
  postgres:
    image: postgis/postgis:18-3.6-alpine
    environment:
      POSTGRES_USER: ivia
      POSTGRES_DB: ivia
      # Local uniquement : pas de mot de passe, le port n'est exposé que sur 127.0.0.1.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Depuis PostgreSQL 18, l'image attend le volume sur /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ivia -d ivia"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Boîte de réception locale : les e-mails de l'API (OTP_SENDER=smtp) s'affichent sur
  # http://localhost:8025 sans jamais sortir vers Internet.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"

  # Carte (docs/decisions/0013). Rien ne démarre sans « --profile geo » : ces services pèsent en RAM.
  # Accessibles depuis le serveur seulement, jamais exposés publiquement.
  redis:
    image: redis:7-alpine
    profiles: [geo]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  # Données à préparer une fois : tools/geo/preparer-osrm.sh
  osrm-car:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    profiles: [geo]
    command: osrm-routed --algorithm mld /data/togo-latest.osrm
    volumes:
      - ./geo-data/osrm-car:/data:ro
    ports:
      - "127.0.0.1:${OSRM_PORT:-5000}:5000"

  # Import d'une trentaine de minutes au premier démarrage.
  nominatim:
    image: mediagis/nominatim:5.1
    profiles: [geo]
    environment:
      PBF_URL: https://download.geofabrik.de/africa/togo-latest.osm.pbf
      REPLICATION_URL: https://download.geofabrik.de/africa/togo-updates/
      IMPORT_STYLE: address
    volumes:
      - nominatim-data:/var/lib/postgresql/16/main
    ports:
      # 8081 : le port 8080 du document est celui de l'API.
      - "127.0.0.1:${NOMINATIM_PORT:-8081}:8080"

volumes:
  nominatim-data:
  postgres-data:
