<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>ivia · aperçu iPhone 17 Pro</title>
<style>
  html, body { margin: 0; height: 100%; background: #e9ebef; font-family: system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; gap: 32px; }
  .phone { position: relative; width: 402px; height: 874px; padding: 14px; border-radius: 62px;
           background: #1b1d22; box-shadow: 0 0 0 2px #4a4d55, 0 30px 80px rgba(0,0,0,.35); }
  .screen { width: 100%; height: 100%; border-radius: 50px; overflow: hidden; background: #fff; }
  iframe { width: 100%; height: 100%; border: 0; }
  .island { position: absolute; top: 25px; left: 50%; transform: translateX(-50%); width: 124px; height: 36px;
            border-radius: 20px; background: #000; z-index: 2; pointer-events: none; }
  .side { max-width: 260px; color: #3a4a60; font-size: 14px; line-height: 1.5; }
  .side h1 { font-size: 20px; color: #0e2e54; margin: 0 0 8px; }
  button { margin-top: 12px; padding: 8px 14px; border-radius: 20px; border: 1px solid #c9ced8; background: #fff; cursor: pointer; }
</style>
</head>
<body>
  <div class="phone">
    <div class="island"></div>
    <div class="screen"><iframe id="app" src="/index.html" title="App ivia" allow="geolocation"></iframe></div>
  </div>
  <div class="side">
    <h1>ivia · iPhone 17 Pro</h1>
    Aperçu local de l'app ivia (402 × 874).<br>
    Connexion : un numéro en 9x ou 7x, le code se remplit seul.<br>
    Pharmacie : « Simuler les réponses (démo) » puis « Simuler la validation » pour les paiements.
    <br><button onclick="document.getElementById('app').src='/index.html'">Relancer l'app</button>
  </div>
</body>
</html>
